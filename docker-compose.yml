services:
  repetitio-api:
    image: repetitio-api:production
    build:
      context: .
      dockerfile: src/backend/Repetitio.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Repetitio: Data Source=/data/repetitio.db
      Cors__AllowedOrigins__0: http://localhost:3000
      Cors__AllowedOrigins__1: http://localhost:5173
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data

  repetitio-web:
    image: repetitio-web:production
    build:
      context: ./src/frontend/repetitio-web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080
    depends_on:
      - repetitio-api
    ports:
      - "3000:80"
